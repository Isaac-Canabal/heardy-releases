name: Release

# Builds the Android APK and the Windows installer, then publishes them as a GitHub
# Release named after the tag, with the asset names the app's updater expects (Heardy.apk, Heardy-Setup.exe).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64            base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
#   ANDROID_KEY_ALIAS
# Optional repository variable:
#   RELEASE_AS_DRAFT                   "true" (default when unset) keeps releases as drafts; set to "false" to publish
#                                      tag pushes immediately.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: true
      dry_run:
        description: 'Dry run: build everything but do not publish a release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Compare tag with pubspec.yaml
        id: v
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pub_version="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n1)"
          if ! [[ "$pub_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read X.Y.Z from pubspec.yaml version"; exit 1
          fi
          echo "version=$pub_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$pub_version" >> "$GITHUB_OUTPUT"

          iss_version="$(sed -n 's/^#define MyAppVersion "\(.*\)"/\1/p' windows/installer/heardy.iss | head -n1)"
          if [ "$iss_version" != "$pub_version" ]; then
            echo "::error::windows/installer/heardy.iss MyAppVersion ($iss_version) != pubspec.yaml ($pub_version)"; exit 1
          fi

          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: tag check skipped."; exit 0
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '$REF_NAME' is not vX.Y.Z"; exit 1
            fi
            if [ "$REF_NAME" != "v$pub_version" ]; then
              echo "::error::Tag $REF_NAME does not match pubspec.yaml version $pub_version"; exit 1
            fi
          fi

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Dependencies and localizations
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Restore signing keystore
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for v in KS_B64 KS_PASS KEY_PASS KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "::add-mask::$KEY_ALIAS"
          # android/app/build.gradle reads ../../heardy-release-key.jks and android/keystore.properties
          printf '%s' "$KS_B64" | base64 -d > heardy-release-key.jks
          {
            echo "storePassword=$KS_PASS"
            echo "keyPassword=$KEY_PASS"
            echo "keyAlias=$KEY_ALIAS"
          } > android/keystore.properties
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Heardy.apk
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f heardy-release-key.jks android/keystore.properties
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: dist/Heardy.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Dependencies and localizations
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Build Windows
        shell: pwsh
        env:
          # firebase_cpp_sdk declares cmake_minimum_required < 3.5, which CMake 4 on the runner rejects.
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          # The runner's newer MSVC turns <experimental/coroutine> into a hard error (permission_handler_windows).
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }
          & $iscc windows\installer\heardy.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\windows\installer\Heardy-Setup.exe dist\Heardy-Setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/Heardy-Setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, android, windows]
    # Dry runs never publish.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: docs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -l dist
      - name: Decide draft state
        id: draft
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DRAFT: ${{ inputs.draft }}
          VAR_DRAFT: ${{ vars.RELEASE_AS_DRAFT }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then d="$INPUT_DRAFT"
          elif [ "$VAR_DRAFT" = "false" ]; then d=false
          else d=true; fi
          echo "draft=$d" >> "$GITHUB_OUTPUT"
      - name: Release notes body
        id: notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          f="docs/release-notes-$VERSION.md"
          if [ -s "$f" ]; then
            echo "path=$f" >> "$GITHUB_OUTPUT"
          else
            echo "Heardy $VERSION" > notes-fallback.md
            echo "path=notes-fallback.md" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Heardy ${{ needs.check.outputs.version }}
          draft: ${{ steps.draft.outputs.draft == 'true' }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
          files: |
            dist/Heardy.apk
            dist/Heardy-Setup.exe
          fail_on_unmatched_files: true
