name: just_audio_media_kit
description: >-
  Fork parchado de just_audio_media_kit (original: Pato05/just_audio_media_kit)
  para uso interno de Heardy: agrega JustAudioMediaKit.rawPlayerFor(id) y
  MediaKitPlayer.rawPlayer, acceso público al Player de media_kit que la API
  original no expone, necesario para aplicarle filtros de audio (af).
version: 2.1.0+1
repository: https://github.com/Isaac-Canabal/heardy-releases

environment:
  sdk: ">=3.1.3 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.2.0
  just_audio_platform_interface: ^4.5.0
  media_kit: ^1.2.0
  universal_platform: ^1.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
