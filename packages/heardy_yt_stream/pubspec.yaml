name: heardy_yt_stream
description: >-
  Internal Heardy plugin (Android only): resolves a YouTube audio-only stream
  URL on the device with NewPipeExtractor, with NewPipe's BotGuard poToken
  WebView port.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.1.3 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  plugin:
    platforms:
      android:
        package: com.heardy.ytstream
        pluginClass: HeardyYtStreamPlugin
