group 'com.heardy.ytstream'
version '0.1.0'

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.heardy.ytstream'
    compileSdk 36

    compileOptions {
        // NewPipeExtractor uses java.nio.file APIs that need desugar_jdk_libs_nio below API 33;
        // the consuming app must enable it too (see android/app/build.gradle).
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }
}

// Pinned to a released tag on JitPack: the JitPack repository is declared in the app's
// android/build.gradle. Bumping this is the fix when YouTube breaks extraction.
def npeVersion = 'v0.26.5'

dependencies {
    implementation "com.github.teamnewpipe:NewPipeExtractor:$npeVersion"
    // Same nanojson commit NewPipeExtractor v0.26.5 depends on (runtime scope there; we compile against it).
    implementation 'com.github.TeamNewPipe:nanojson:e9d656ddb49a412a5a0a5d5ef20ca7ef09549996'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'
}
