include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    prefer_single_quotes: false
    unawaited_futures: false
    # Heardy: el Dart de este fork es el de upstream sin tocar; no se reescribe
    # sólo para cumplir lints más nuevos que el paquete original.
    use_super_parameters: false
